; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_devkitc_freenove_cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.file_system = littlefs
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_MAX_SDMMC_FREQ=SDMMC_FREQ_DEFAULT
	-DINCLUDE_PERIPH=1
	-DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0
build_src_filter = +<*> -<*.ino>
monitor_speed = 115200
upload_speed = 921600
lib_deps = Person_detection_FOMO_inferencing
